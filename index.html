<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 15曲無限ループ選曲版</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ffeaa7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Chalkboard SE", "Comic Sans MS", sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 6px solid #6c5ce7;
      border-radius: 24px;
      background-color: #fffdf9;
      box-shadow: 0 12px 24px rgba(108, 92, 231, 0.25);
      overflow: hidden;
      touch-action: none;
      transform: translateY(-19px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
      border: 3px solid #fff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(214, 48, 49, 0.4);
    }
    .btn:active {
      transform: translateY(2px);
    }

    #score-display {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #6c5ce7;
      pointer-events: none;
      text-shadow: 1px 1px 0px #fff;
      z-index: 5;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 253, 249, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 20;
      padding-top: 20px;
      box-sizing: border-box;
    }

    #select-title {
      font-size: 22px;
      color: #6c5ce7;
      margin-bottom: 10px;
      font-weight: bold;
      animation: floatTitle 2s ease-in-out infinite alternate;
      display: inline-block;
      z-index: 2;
    }

    @keyframes floatTitle {
      0% { transform: translateY(0) rotate(-1.5deg); }
      100% { transform: translateY(-6px) rotate(1.5deg); }
    }

    /* 無限スクロール用の表示エリア */
    #infinite-scroll-viewport {
      width: 300px;
      height: 480px;
      overflow-y: scroll;
      overflow-x: hidden;
      z-index: 2;
      position: relative;
      /* スクロールバー非表示（Chrome, Safari, Firefox） */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #infinite-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    #song-list-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 楽曲カードのスタイル */
    .song-card {
      width: 270px;
      padding: 12px 14px;
      margin: 8px 0;
      background: #fff;
      border: 3px solid #fdcb6e;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      transition: transform 0.1s ease;
      flex-shrink: 0;
    }

    .song-card:active {
      transform: scale(0.95) !important;
    }

    .song-info {
      text-align: left;
    }
    .song-name {
      font-size: 16px;
      font-weight: bold;
      color: #2d3436;
    }
    .song-meta {
      font-size: 11px;
      color: #b2bec3;
      margin-top: 2px;
    }
    .song-highscore {
      font-size: 13px;
      font-weight: bold;
      color: #6c5ce7;
      text-align: right;
    }

    /* 背景パーティクル */
    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      pointer-events: none;
      user-select: none;
      animation: floatUp 4s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-630px) rotate(360deg) scale(1.2); opacity: 0; }
    }

    #result-card {
      width: 280px;
      padding: 20px;
      background: #fff;
      border: 4px solid #fdcb6e;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .result-title {
      font-size: 26px;
      color: #ff7675;
      margin: 0 0 8px 0;
      font-weight: bold;
    }
    .result-score-val {
      font-size: 32px;
      color: #6c5ce7;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .new-record-tag {
      display: inline-block;
      background: #ff7675;
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .result-details {
      width: 100%;
      margin: 8px 0 16px 0;
      border-top: 2px dashed #dfe6e9;
      padding-top: 8px;
      font-size: 15px;
      color: #2d3436;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>

  <!-- 選曲画面 -->
  <div id="select-screen" class="overlay-screen">
    <div id="particle-container"></div>
    <div id="select-title">★ きょくをえらぶ ★</div>
    <div id="infinite-scroll-viewport">
      <div id="song-list-container"></div>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen" class="overlay-screen" style="display: none; justify-content: center; padding-top: 0;">
    <div id="result-card">
      <h2 class="result-title">STAGE CLEAR!</h2>
      <div id="new-record" class="new-record-tag" style="display: none;">NEW HIGH SCORE!</div>
      <div id="res-score" class="result-score-val">0</div>
      
      <div class="result-details">
        <div class="result-row"><span>MAX COMBO</span><strong id="res-combo" style="color: #6c5ce7;">0</strong></div>
        <div class="result-row"><span>PERFECT</span><strong id="res-perfect" style="color: #fdcb6e;">0</strong></div>
        <div class="result-row"><span>GREAT</span><strong id="res-great" style="color: #00b894;">0</strong></div>
        <div class="result-row"><span>GOOD</span><strong id="res-good" style="color: #0984e3;">0</strong></div>
        <div class="result-row"><span>MISS</span><strong id="res-miss" style="color: #d63031;">0</strong></div>
      </div>

      <div class="btn-group">
        <button id="select-btn" class="btn" style="background: #b2bec3;">えらびなおす</button>
        <button id="retry-btn" class="btn">もう一度</button>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  // 15曲の楽曲リスト定義
  const songList = [
    { id: 'song1', name: '1. きらきら星', totalNotes: 30, speed: 4, color: '#ff7675' },
    { id: 'song2', name: '2. チューリップ', totalNotes: 35, speed: 4.1, color: '#00b894' },
    { id: 'song3', name: '3. どんぐりころころ', totalNotes: 40, speed: 4.2, color: '#6c5ce7' },
    { id: 'song4', name: '4. ちょうちょう', totalNotes: 32, speed: 4.0, color: '#fdcb6e' },
    { id: 'song5', name: '5. 大きな栗の木の下で', totalNotes: 45, speed: 4.4, color: '#e84393' },
    { id: 'song6', name: '6. ぶんぶんぶん', totalNotes: 38, speed: 4.3, color: '#0984e3' },
    { id: 'song7', name: '7. むすんでひらいて', totalNotes: 42, speed: 4.2, color: '#10ac84' },
    { id: 'song8', name: '8. かえるの合唱', totalNotes: 48, speed: 4.5, color: '#2e86de' },
    { id: 'song9', name: '9. メリーさんのひつじ', totalNotes: 36, speed: 4.1, color: '#ff9ff3' },
    { id: 'song10', name: '10. ロンドン橋', totalNotes: 50, speed: 4.6, color: '#f39c12' },
    { id: 'song11', name: '11. 線路はつづくよどこまでも', totalNotes: 55, speed: 4.8, color: '#ee5253' },
    { id: 'song12', name: '12. アルプス一万尺', totalNotes: 60, speed: 5.0, color: '#00d2d3' },
    { id: 'song13', name: '13. おもちゃのチャチャチャ', totalNotes: 52, speed: 4.7, color: '#54a0ff' },
    { id: 'song14', name: '14. クラリネットをこわしちゃった', totalNotes: 58, speed: 4.9, color: '#5f27cd' },
    { id: 'song15', name: '15. 森のくまさん', totalNotes: 65, speed: 5.2, color: '#ff6b6b' }
  ];

  let currentSong = songList[0];

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const selectScreen = document.getElementById('select-screen');
  const resultScreen = document.getElementById('result-screen');
  const viewport = document.getElementById('infinite-scroll-viewport');
  const songListContainer = document.getElementById('song-list-container');
  const particleContainer = document.getElementById('particle-container');
  const scoreDisplay = document.getElementById('score-display');
  const retryBtn = document.getElementById('retry-btn');
  const selectBtn = document.getElementById('select-btn');
  const newRecordTag = document.getElementById('new-record');

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let counts = { perfect: 0, great: 0, good: 0, miss: 0 };

  let judgeText = '';
  let judgeColor = '#2d3436';
  let judgeTimer = 0;
  let hitEffects = [];
  let particleInterval = null;

  const laneCount = 4;
  const laneWidth = canvas.width / laneCount;
  const laneXPositions = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5, laneWidth * 3.5];
  const keyLabels = ['D', 'F', 'J', 'K'];

  const targetY = 500;
  const targetRadius = 28;
  let isLaneHolding = [false, false, false, false];

  let notes = [];
  let spawnTimer = 0;
  let spawnedCount = 0;

  /* --- パーティクル生成 --- */
  const symbols = ['♪', '♫', '♬', '✨', '★', '🌸', '🎶'];
  const colors = ['#ff7675', '#fdcb6e', '#00b894', '#0984e3', '#6c5ce7', '#e84393'];

  function createParticle() {
    if (selectScreen.style.display === 'none') return;

    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.color = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = Math.random() * 320 + 20 + 'px';
    p.style.fontSize = Math.floor(Math.random() * 12 + 16) + 'px';
    
    const duration = (Math.random() * 2 + 3).toFixed(1);
    p.style.animationDuration = duration + 's';

    particleContainer.appendChild(p);

    setTimeout(() => { p.remove(); }, duration * 1000);
  }

  function startParticles() {
    stopParticles();
    particleInterval = setInterval(createParticle, 400);
  }

  function stopParticles() {
    if (particleInterval) clearInterval(particleInterval);
    particleContainer.innerHTML = '';
  }

  /* --- 15曲無限ループスクロール構築 --- */
  let singleSetHeight = 0;

  function renderSongSelectUI() {
    songListContainer.innerHTML = '';

    // 無限ループ用にセットを3つ生成（[前クローン] [本データ] [後クローン]）
    const fullList = [...songList, ...songList, ...songList];

    fullList.forEach((song, idx) => {
      const savedScore = localStorage.getItem(`highscore_${song.id}`) || 0;
      const card = document.createElement('div');
      card.className = 'song-card';
      card.style.borderColor = song.color;
      card.innerHTML = `
        <div class="song-info">
          <div class="song-name">${song.name}</div>
          <div class="song-meta">ノーツ: ${song.totalNotes} / スピード: ${song.speed}</div>
        </div>
        <div class="song-highscore">
          <div style="font-size: 9px; color: #b2bec3;">HIGH SCORE</div>
          <div>${Number(savedScore).toLocaleString()}</div>
        </div>
      `;
      card.addEventListener('click', () => startSong(song));
      songListContainer.appendChild(card);
    });

    startParticles();

    // DOM描画完了後にスクロール位置を中央セットの先頭に調整
    requestAnimationFrame(() => {
      const cardElements = songListContainer.querySelectorAll('.song-card');
      if (cardElements.length > 0) {
        // カード1枚の高さ（マージン含む）× 15曲分 ＝ 1セットの高さ
        const cardHeight = cardElements[0].offsetHeight + 16; 
        singleSetHeight = cardHeight * songList.length;

        // 初期位置を中央セットの最上部にセット
        viewport.scrollTop = singleSetHeight;
      }
    });
  }

  // スクロール時のループ判定処理
  viewport.addEventListener('scroll', () => {
    if (singleSetHeight === 0) return;

    // 上端近くまで来たら中央セットへ一瞬でワープ
    if (viewport.scrollTop < singleSetHeight * 0.5) {
      viewport.scrollTop += singleSetHeight;
    }
    // 下端近くまで来たら中央セットへ一瞬でワープ
    else if (viewport.scrollTop > singleSetHeight * 1.8) {
      viewport.scrollTop -= singleSetHeight;
    }
  });

  function startSong(song) {
    currentSong = song;
    stopParticles();
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    selectScreen.style.display = 'none';
    resultScreen.style.display = 'none';
    resetGame();
    isPlaying = true;
    gameLoop();
  }

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    notes = [];
    spawnTimer = 0;
    spawnedCount = 0;
    scoreDisplay.textContent = `SCORE: 0`;
  }

  function playSound(freqMult = 1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 * freqMult, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600 * freqMult, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function createHitEffect(x, y, color) {
    hitEffects.push({ x: x, y: y, radius: 20, maxRadius: 55, alpha: 1.0, color: color });
  }

  function updateCombo(newCombo) {
    combo = newCombo;
    if (combo > maxCombo) maxCombo = combo;
  }

  function applyJudgement(distance, laneIndex) {
    const x = laneXPositions[laneIndex];
    if (distance < 25) {
      judgeText = 'PERFECT!';
      judgeColor = '#fdcb6e';
      score += 100;
      counts.perfect++;
      updateCombo(combo + 1);
      playSound(1.5);
      createHitEffect(x, targetY, '#fdcb6e');
    } else if (distance < 45) {
      judgeText = 'GREAT!';
      judgeColor = '#00b894';
      score += 80;
      counts.great++;
      updateCombo(combo + 1);
      playSound(1.2);
      createHitEffect(x, targetY, '#00b894');
    } else if (distance < 70) {
      judgeText = 'GOOD';
      judgeColor = '#0984e3';
      score += 50;
      counts.good++;
      updateCombo(combo + 1);
      playSound(1.0);
      createHitEffect(x, targetY, '#0984e3');
    }
    judgeTimer = 30;
    scoreDisplay.textContent = `SCORE: ${score}`;
  }

  function triggerMiss() {
    judgeText = 'MISS...';
    judgeColor = '#d63031';
    judgeTimer = 30;
    counts.miss++;
    updateCombo(0);
  }

  function handleTouchStart(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = true;

    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      if (note.lane === laneIndex && !note.holding) {
        const distance = Math.abs(note.y - targetY);
        if (distance < minDistance) {
          minDistance = distance;
          hitIndex = index;
        }
      }
    });

    if (hitIndex !== -1 && minDistance < 70) {
      const note = notes[hitIndex];
      if (note.type === 'normal' || note.type === 'slide') {
        notes.splice(hitIndex, 1);
        applyJudgement(minDistance, laneIndex);
      } else if (note.type === 'hold') {
        note.holding = true;
        applyJudgement(minDistance, laneIndex);
      }
    }
  }

  function handleTouchEnd(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = false;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'hold' && note.holding) {
        const tailY = note.y - note.length;
        const distance = Math.abs(tailY - targetY);
        notes.splice(i, 1);
        applyJudgement(distance, laneIndex);
      }
    }
  }

  function handleSlide(laneIndex) {
    if (!isPlaying) return;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'slide') {
        const distance = Math.abs(note.y - targetY);
        if (distance < 70) {
          notes.splice(i, 1);
          applyJudgement(distance, laneIndex);
        }
      }
    }
  }

  function spawnNotes() {
    if (spawnedCount >= currentSong.totalNotes) return;

    spawnTimer++;
    if (spawnTimer > 40) {
      const lane = Math.floor(Math.random() * laneCount);
      const rand = Math.random();
      const spd = currentSong.speed;

      if (rand < 0.50) {
        notes.push({ type: 'normal', lane: lane, y: 0, speed: spd });
      } else if (rand < 0.75) {
        notes.push({ type: 'hold', lane: lane, y: 0, length: 120, speed: spd, holding: false });
      } else {
        notes.push({ type: 'slide', lane: lane, y: 0, speed: spd });
      }

      spawnTimer = 0;
      spawnedCount++;
    }
  }

  function showResult() {
    isPlaying = false;

    const prevScore = Number(localStorage.getItem(`highscore_${currentSong.id}`)) || 0;
    if (score > prevScore) {
      localStorage.setItem(`highscore_${currentSong.id}`, score);
      newRecordTag.style.display = 'inline-block';
    } else {
      newRecordTag.style.display = 'none';
    }

    document.getElementById('res-score').textContent = score;
    document.getElementById('res-combo').textContent = maxCombo;
    document.getElementById('res-perfect').textContent = counts.perfect;
    document.getElementById('res-great').textContent = counts.great;
    document.getElementById('res-good').textContent = counts.good;
    document.getElementById('res-miss').textContent = counts.miss;

    resultScreen.style.display = 'flex';
  }

  function gameLoop() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    for (let i = 1; i < laneCount; i++) {
      ctx.beginPath();
      ctx.moveTo(laneWidth * i, 0);
      ctx.lineTo(laneWidth * i, canvas.height);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for (let i = 0; i < laneCount; i++) {
      const x = laneXPositions[i];
      ctx.save();
      if (isLaneHolding[i]) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#55efc4';
      }
      ctx.beginPath();
      ctx.arc(x, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isLaneHolding[i] ? '#55efc4' : '#fdcb6e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.fillStyle = isLaneHolding[i] ? 'rgba(85, 239, 196, 0.4)' : 'rgba(253, 203, 110, 0.25)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#b2bec3';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(keyLabels[i], x, targetY + 52);
    }

    spawnNotes();

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;
      const x = laneXPositions[note.lane];

      ctx.save();

      if (note.type === 'normal') {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff7675';
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(x, note.y, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 4, note.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'hold') {
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#55efc4';
        ctx.fillStyle = 'rgba(85, 239, 196, 0.7)';
        ctx.fillRect(x - 16, tailY, 32, headY - tailY);

        ctx.fillStyle = '#00b894';
        ctx.beginPath();
        ctx.arc(x, headY, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, tailY, 18, 0, Math.PI * 2);
        ctx.fill();

        if (tailY > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'slide') {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0984e3';
        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.roundRect(x - 22, note.y - 14, 44, 28, 14);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('〰', x, note.y + 7);

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      }

      ctx.restore();
    }

    for (let i = hitEffects.length - 1; i >= 0; i--) {
      let effect = hitEffects[i];
      effect.radius += 2.5;
      effect.alpha -= 0.05;

      ctx.save();
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
      ctx.strokeStyle = effect.color;
      ctx.globalAlpha = Math.max(0, effect.alpha);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      if (effect.alpha <= 0) hitEffects.splice(i, 1);
    }

    if (judgeTimer > 0) {
      ctx.fillStyle = judgeColor;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(judgeText, canvas.width / 2, targetY - 80);
      judgeTimer--;
    }

    if (combo > 1) {
      ctx.fillStyle = '#6c5ce7';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${combo} COMBO!`, canvas.width / 2, targetY - 120);
    }

    if (spawnedCount >= currentSong.totalNotes && notes.length === 0) {
      showResult();
      return;
    }

    requestAnimationFrame(gameLoop);
  }

  retryBtn.addEventListener('click', () => startSong(currentSong));
  selectBtn.addEventListener('click', () => {
    resultScreen.style.display = 'none';
    renderSongSelectUI();
    selectScreen.style.display = 'flex';
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) handleTouchStart(laneIndex);
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) handleSlide(laneIndex);
    }
  });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let lane = 0; lane < laneCount; lane++) {
      let stillTouching = false;
      for (let i = 0; i < e.touches.length; i++) {
        const touchX = e.touches[i].clientX - rect.left;
        const laneIndex = Math.floor(touchX / (rect.width / laneCount));
        if (laneIndex === lane) stillTouching = true;
      }
      if (!stillTouching && isLaneHolding[lane]) handleTouchEnd(lane);
    }
  });

  renderSongSelectUI();
</script>

</body>
</html>
