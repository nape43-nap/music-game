<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 5曲版</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kaisei+Opti:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ffeaa7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Kaisei Opti", serif;
      overflow: hidden;
    }

    #stage-wrapper {
      position: relative;
      width: 360px;
      height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Music Select の位置 (images/2.png を使用) */
    #floating-title {
      position: absolute;
      top: 15px;
      left: 30px;
      width: 140px;
      height: 50px;
      background: url('images/2.png') no-repeat center/contain;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      animation: floatTitle 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
    }
    #floating-title span {
      display: none; /* テキストの代わりに画像を表示するため非表示に */
    }

    @keyframes floatTitle {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    /* 一番外の枠 (images/1.png を背景・枠として使用) */
    #game-container {
      position: absolute;
      top: 45px;
      left: 0;
      width: 360px;
      height: 580px;
      border: none; /* 従来のボーダーをなくし画像に置換 */
      background: url('images/1.png') no-repeat center/contain;
      background-color: #fcf9f2; /* 画像が読み込まれるまでの背景色 */
      box-shadow: 0 12px 28px rgba(184, 74, 74, 0.25);
      overflow: hidden;
      touch-action: none;
    }

    #girl-peek {
      position: absolute;
      top: 15px;
      right: 25px;
      width: 54px;
      height: 40px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 45"><ellipse cx="30" cy="25" rx="22" ry="18" fill="%238b5a2b"/><circle cx="30" cy="22" r="16" fill="%23ffeaa7"/><path d="M18,18 Q30,8 42,18 Z" fill="%23654321"/><circle cx="23" cy="22" r="2" fill="%232d3436"/><circle cx="37" cy="22" r="2" fill="%232d3436"/><path d="M28,26 Q30,29 32,26" fill="none" stroke="%23d63031" stroke-width="1.5" stroke-linecap="round"/><circle cx="19" cy="25" r="3" fill="%23ff7675" opacity="0.6"/><circle cx="41" cy="25" r="3" fill="%23ff7675" opacity="0.6"/><path d="M10,32 Q15,22 22,28" fill="%23ffeaa7" stroke="%238b5a2b" stroke-width="2" stroke-linecap="round"/><path d="M50,32 Q45,22 38,28" fill="%23ffeaa7" stroke="%238b5a2b" stroke-width="2" stroke-linecap="round"/></svg>') no-repeat center/contain;
      z-index: 26;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(214, 48, 49, 0.4);
      font-family: "Kaisei Opti", serif;
    }
    .btn:active {
      transform: translateY(2px);
    }

    #score-display {
      position: absolute;
      top: 14px;
      left: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #b84a4a;
      pointer-events: none;
      text-shadow: 1px 1px 0px #fff;
      z-index: 5;
      font-family: "Caveat", cursive;
      letter-spacing: 1px;
    }

    #back-to-select-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 14px;
      font-weight: bold;
      color: #b84a4a;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #b84a4a;
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      z-index: 10;
      transition: transform 0.1s ease, background 0.1s ease;
      font-family: "Kaisei Opti", serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #back-to-select-btn:active {
      transform: scale(0.92);
      background: #fff;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(252, 249, 242, 0.94);
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.03) 15%, transparent 16%),
        radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      background-position: 0 0, 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 20;
      padding-top: 65px;
      box-sizing: border-box;
    }

    #virtual-scroll-viewport {
      width: 330px;
      height: 485px;
      overflow-y: scroll;
      overflow-x: hidden;
      z-index: 2;
      position: relative;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #virtual-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    #virtual-scroll-spacer {
      position: relative;
      width: 100%;
    }

    /* 曲一覧の枠 (images/3.png を使用) */
    .song-card {
      position: absolute;
      left: 10px;
      width: 310px;
      height: 72px;
      padding: 6px 14px 6px 14px;
      background: url('images/3.png') no-repeat center/contain;
      background-color: #ffffff; /* 画像が読み込まれるまでの背景 */
      border: none; /* 従来のボーダーを外す */
      border-radius: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      transition: transform 0.1s ease;
      font-family: "Kaisei Opti", serif;
    }

    .song-card::after {
      display: none; /* 従来の丸ぽちを非表示 */
    }

    .song-card:active {
      transform: scale(0.95) !important;
    }

    .song-info {
      text-align: left;
      flex-grow: 1;
      margin-left: 6px;
      min-width: 0;
      padding-right: 15px;
    }
    .song-name {
      font-size: 13px;
      font-weight: bold;
      color: #2d3436;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .song-composer {
      font-size: 12px;
      color: #636e72;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-highscore {
      font-size: 13px;
      font-weight: bold;
      color: #b84a4a;
      text-align: right;
      flex-shrink: 0;
      margin-right: 16px;
    }

    #credit-screen {
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 30;
      background-color: rgba(252, 249, 242, 0.98);
    }
    .credit-card {
      width: 280px;
      padding: 24px;
      background: #fff;
      border: 4px solid #b84a4a;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      font-family: "Kaisei Opti", serif;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .credit-jacket {
      font-size: 64px;
      margin-bottom: 12px;
      animation: pulseJacket 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulseJacket {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    .credit-title {
      font-size: 20px;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 6px;
    }
    .credit-composer-text {
      font-size: 15px;
      color: #b84a4a;
      margin-bottom: 16px;
    }
    .credit-loading {
      font-size: 22px;
      color: #b2bec3;
      font-family: "Caveat", cursive;
      letter-spacing: 2px;
    }

    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      pointer-events: none;
      user-select: none;
      animation: floatUp 4s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-600px) rotate(360deg) scale(1.2); opacity: 0; }
    }

    #result-card {
      width: 280px;
      padding: 16px 20px;
      background: #fff;
      background-image: radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      border: 4px solid #b84a4a;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
      font-family: "Kaisei Opti", serif;
    }
    .result-title {
      font-size: 32px;
      color: #ff7675;
      margin: 0 0 4px 0;
      font-weight: bold;
      font-family: "Caveat", cursive;
      letter-spacing: 1px;
    }
    .result-score-val {
      font-size: 38px;
      color: #b84a4a;
      font-weight: bold;
      margin-bottom: 2px;
      font-family: "Caveat", cursive;
    }
    .tag-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
      min-height: 22px;
    }
    .badge-tag {
      display: inline-block;
      color: #fff;
      font-size: 15px;
      padding: 2px 10px;
      border-radius: 8px;
      font-family: "Caveat", cursive;
      font-weight: bold;
    }
    .result-details {
      width: 100%;
      margin: 4px 0 12px 0;
      border-top: 2px dashed #dfe6e9;
      padding-top: 6px;
      font-size: 18px;
      color: #2d3436;
      font-family: "Caveat", cursive;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    #result-screen .btn {
      font-family: "Kaisei Opti", serif;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div id="stage-wrapper">
  <div id="floating-title"><span>Music Select</span></div>

  <div id="game-container">
    <div id="girl-peek"></div>
    <div id="score-display">SCORE: 0</div>
    <button id="back-to-select-btn">◀ 戻る</button>

    <div id="select-screen" class="overlay-screen">
      <div id="particle-container"></div>
      <div id="virtual-scroll-viewport">
        <div id="virtual-scroll-spacer"></div>
      </div>
    </div>

    <div id="credit-screen" class="overlay-screen">
      <div class="credit-card">
        <div id="credit-jacket" class="credit-jacket">🌟</div>
        <div id="credit-title" class="credit-title">曲名</div>
        <div id="credit-composer" class="credit-composer-text">Composer</div>
        <div class="credit-loading">Now Loading...</div>
      </div>
    </div>

    <div id="result-screen" class="overlay-screen" style="display: none; justify-content: center; padding-top: 0;">
      <div id="result-card">
        <h2 class="result-title">STAGE CLEAR!</h2>
        
        <div class="tag-container">
          <div id="new-record" class="badge-tag" style="background: #ff7675; display: none;">NEW RECORD!</div>
          <div id="all-perfect-tag" class="badge-tag" style="background: #fdcb6e; color: #2d3436; display: none;">ALL PERFECT!</div>
          <div id="no-miss-tag" class="badge-tag" style="background: #00b894; display: none;">NO MISS!</div>
        </div>

        <div id="res-score" class="result-score-val">0</div>
        
        <div class="result-details">
          <div class="result-row"><span>MAX COMBO</span><strong id="res-combo" style="color: #b84a4a; font-size: 20px;">0</strong></div>
          <div class="result-row"><span>PERFECT</span><strong id="res-perfect" style="color: #fdcb6e; font-size: 20px;">0</strong></div>
          <div class="result-row"><span>GREAT</span><strong id="res-great" style="color: #00b894; font-size: 20px;">0</strong></div>
          <div class="result-row"><span>GOOD</span><strong id="res-good" style="color: #0984e3; font-size: 20px;">0</strong></div>
          <div class="result-row"><span>MISS</span><strong id="res-miss" style="color: #d63031; font-size: 20px;">0</strong></div>
        </div>

        <div class="btn-group">
          <button id="select-btn" class="btn" style="background: #b2bec3;">曲選択へ戻る</button>
          <button id="retry-btn" class="btn">もう一度</button>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas" width="360" height="580"></canvas>
  </div>
</div>
