<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー プロトタイプ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f1e3; /* 温かみのある紙のような背景色 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 4px solid #8e5470;
      border-radius: 16px;
      background-color: #fffdf9;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #ff7675;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      z-index: 10;
    }
    #start-btn:active {
      transform: translate(-50%, -46%);
      box-shadow: none;
    }
    #score-display {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #2d3436;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>
  <button id="start-btn">ゲームスタート</button>
  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const scoreDisplay = document.getElementById('score-display');

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  
  // 判定ラインの位置（Y座標）
  const targetY = 500;
  const targetRadius = 35;

  // ノーツ（落ちてくるオブジェクト）の配列
  let notes = [];
  let spawnTimer = 0;

  // Web Audio API で効果音（ポコッという音）を生成して鳴らす関数
  function playHitSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  // タップ・クリック時の判定処理
  function handleTap() {
    if (!isPlaying) return;

    playHitSound();

    // 判定ラインに最も近いノーツを探す
    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      const distance = Math.abs(note.y - targetY);
      if (distance < minDistance) {
        minDistance = distance;
        hitIndex = index;
      }
    });

    // 距離が50px以内ならヒット判定
    if (hitIndex !== -1 && minDistance < 50) {
      notes.splice(hitIndex, 1); // ノーツを消す
      score += 100;
      scoreDisplay.textContent = `SCORE: ${score}`;
    }
  }

  // ゲームのメインループ（1秒間に約60回実行される）
  function gameLoop() {
    if (!isPlaying) return;

    // 画面のクリア
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 判定ライン（絵本風のターゲット枠）の描画
    ctx.beginPath();
    ctx.arc(canvas.width / 2, targetY, targetRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#fdcb6e';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.fillStyle = 'rgba(253, 203, 110, 0.2)';
    ctx.fill();

    // 2. ノーツの追加（一定時間ごとに上から降らせる）
    spawnTimer++;
    if (spawnTimer > 60) { // 約1秒ごと
      notes.push({ y: 0, speed: 4 });
      spawnTimer = 0;
    }

    // 3. ノーツの移動と描画
    ctx.fillStyle = '#ff7675';
    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;

      // ノーツ（丸）を描画
      ctx.beginPath();
      ctx.arc(canvas.width / 2, note.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // 画面下に消えたら削除
      if (note.y > canvas.height + 20) {
        notes.splice(i, 1);
      }
    }

    requestAnimationFrame(gameLoop);
  }

  // スタートボタンを押した時の処理
  startBtn.addEventListener('click', () => {
    // スマホのWeb Audio API制限を解除するためにボタン押下時に初期化
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    startBtn.style.display = 'none';
    isPlaying = true;
    gameLoop();
  });

  // 操作イベントの登録（画面タップ・キーボード）
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleTap();
  });
  canvas.addEventListener('mousedown', handleTap);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      handleTap();
    }
  });
</script>

</body>
</html>
