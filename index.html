<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 判定＆コンボ版</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f1e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 4px solid #8e5470;
      border-radius: 16px;
      background-color: #fffdf9;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      touch-action: manipulation;
      transform: translateY(-19px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #ff7675;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      z-index: 10;
    }
    #start-btn:active {
      transform: translate(-50%, -46%);
      box-shadow: none;
    }
    #score-display {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #2d3436;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>
  <button id="start-btn">ゲームスタート</button>
  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const scoreDisplay = document.getElementById('score-display');

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  let combo = 0;

  // 判定文字アニメーション用
  let judgeText = '';
  let judgeColor = '#2d3436';
  let judgeTimer = 0;

  // レーン設定
  const laneCount = 4;
  const laneWidth = canvas.width / laneCount;
  const laneXPositions = [
    laneWidth * 0.5,
    laneWidth * 1.5,
    laneWidth * 2.5,
    laneWidth * 3.5
  ];
  const keyLabels = ['D', 'F', 'J', 'K'];

  // 判定ライン
  const targetY = 500;
  const targetRadius = 28;

  // ノーツデータ
  let notes = [];
  let spawnTimer = 0;

  const laneFrequencies = [300, 400, 500, 600];

  function playHitSound(laneIndex) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    const freq = laneFrequencies[laneIndex] || 400;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  // 判定処理
  function handleTap(laneIndex) {
    if (!isPlaying) return;

    playHitSound(laneIndex);

    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      if (note.lane === laneIndex) {
        const distance = Math.abs(note.y - targetY);
        if (distance < minDistance) {
          minDistance = distance;
          hitIndex = index;
        }
      }
    });

    // 距離に応じた判定
    if (hitIndex !== -1 && minDistance < 70) {
      notes.splice(hitIndex, 1);
      
      if (minDistance < 20) {
        judgeText = 'PERFECT!';
        judgeColor = '#fdcb6e';
        score += 100;
        combo++;
      } else if (minDistance < 40) {
        judgeText = 'GREAT!';
        judgeColor = '#00b894';
        score += 80;
        combo++;
      } else if (minDistance < 70) {
        judgeText = 'GOOD';
        judgeColor = '#0984e3';
        score += 50;
        combo++;
      }
      judgeTimer = 30; // 30フレーム間判定を表示
      scoreDisplay.textContent = `SCORE: ${score}`;
    }
  }

  // ノーツ生成（たまに同時押しを発生させる）
  function spawnNotes() {
    spawnTimer++;
    if (spawnTimer > 40) {
      const isSimultaneous = Math.random() < 0.25; // 25%の確率で同時押し

      const lane1 = Math.floor(Math.random() * laneCount);
      notes.push({ lane: lane1, y: 0, speed: 4.5 });

      if (isSimultaneous) {
        let lane2 = Math.floor(Math.random() * laneCount);
        while (lane2 === lane1) {
          lane2 = Math.floor(Math.random() * laneCount);
        }
        notes.push({ lane: lane2, y: 0, speed: 4.5 });
      }

      spawnTimer = 0;
    }
  }

  // メインゲームループ
  function gameLoop() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. レーン区切り線
    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 2;
    for (let i = 1; i < laneCount; i++) {
      ctx.beginPath();
      ctx.moveTo(laneWidth * i, 0);
      ctx.lineTo(laneWidth * i, canvas.height);
      ctx.stroke();
    }

    // 2. 判定ライン
    for (let i = 0; i < laneCount; i++) {
      const x = laneXPositions[i];
      
      ctx.beginPath();
      ctx.arc(x, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = '#fdcb6e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(253, 203, 110, 0.2)';
      ctx.fill();

      ctx.fillStyle = '#b2bec3';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(keyLabels[i], x, targetY + 55);
    }

    // 3. ノーツ生成
    spawnNotes();

    // 4. ノーツの移動・描画・MISS判定
    ctx.fillStyle = '#ff7675';
    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;

      const x = laneXPositions[note.lane];
      ctx.beginPath();
      ctx.arc(x, note.y, 18, 0, Math.PI * 2);
      ctx.fill();

      // 判定ラインを通り過ぎたらMISS
      if (note.y > targetY + 70) {
        notes.splice(i, 1);
        judgeText = 'MISS...';
        judgeColor = '#d63031';
        judgeTimer = 30;
        combo = 0; // コンボリセット
      }
    }

    // 5. 判定文字 & コンボ表示
    if (judgeTimer > 0) {
      ctx.fillStyle = judgeColor;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(judgeText, canvas.width / 2, targetY - 80);
      judgeTimer--;
    }

    if (combo > 1) {
      ctx.fillStyle = '#6c5ce7';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${combo} COMBO!`, canvas.width / 2, targetY - 120);
    }

    requestAnimationFrame(gameLoop);
  }

  startBtn.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startBtn.style.display = 'none';
    isPlaying = true;
    gameLoop();
  });

  // マルチタッチ対応
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) {
        handleTap(laneIndex);
      }
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const laneIndex = Math.floor(clickX / (rect.width / laneCount));
    if (laneIndex >= 0 && laneIndex < laneCount) {
      handleTap(laneIndex);
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') handleTap(0);
    if (e.key === 'f' || e.key === 'F') handleTap(1);
    if (e.key === 'j' || e.key === 'J') handleTap(2);
    if (e.key === 'k' || e.key === 'K') handleTap(3);
  });
</script>

</body>
</html>
