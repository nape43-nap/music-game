<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 速度調整版</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ffeaa7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Chalkboard SE", "Comic Sans MS", sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 6px solid #6c5ce7;
      border-radius: 24px;
      background-color: #fffdf9;
      box-shadow: 0 12px 24px rgba(108, 92, 231, 0.25);
      overflow: hidden;
      touch-action: none;
      transform: translateY(-19px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 36px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
      border: 3px solid #fff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(214, 48, 49, 0.4);
      z-index: 10;
    }
    .btn:active {
      transform: translate(-50%, -44%);
      box-shadow: 0 2px 4px rgba(214, 48, 49, 0.4);
    }
    #score-display {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #6c5ce7;
      pointer-events: none;
      text-shadow: 1px 1px 0px #fff;
    }

    /* リザルト画面スタイル */
    #result-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 253, 249, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #result-card {
      width: 280px;
      padding: 24px 20px;
      background: #fff;
      border: 4px solid #fdcb6e;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .result-title {
      font-size: 28px;
      color: #ff7675;
      margin: 0 0 12px 0;
      font-weight: bold;
    }
    .result-score-label {
      font-size: 14px;
      color: #b2bec3;
      margin-bottom: 2px;
    }
    .result-score-val {
      font-size: 36px;
      color: #6c5ce7;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .result-details {
      width: 100%;
      margin: 12px 0 20px 0;
      border-top: 2px dashed #dfe6e9;
      padding-top: 12px;
      font-size: 16px;
      color: #2d3436;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    #retry-btn {
      position: static;
      transform: none;
      margin-top: 8px;
      padding: 12px 28px;
      font-size: 18px;
    }
    #retry-btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>
  <button id="start-btn" class="btn">★ あそぶ ★</button>

  <!-- リザルト画面 -->
  <div id="result-screen">
    <div id="result-card">
      <h2 class="result-title">STAGE CLEAR!</h2>
      <div class="result-score-label">FINAL SCORE</div>
      <div id="res-score" class="result-score-val">0</div>
      
      <div class="result-details">
        <div class="result-row"><span>MAX COMBO</span><strong id="res-combo" style="color: #6c5ce7;">0</strong></div>
        <div class="result-row"><span>PERFECT</span><strong id="res-perfect" style="color: #fdcb6e;">0</strong></div>
        <div class="result-row"><span>GREAT</span><strong id="res-great" style="color: #00b894;">0</strong></div>
        <div class="result-row"><span>GOOD</span><strong id="res-good" style="color: #0984e3;">0</strong></div>
        <div class="result-row"><span>MISS</span><strong id="res-miss" style="color: #d63031;">0</strong></div>
      </div>

      <button id="retry-btn" class="btn">もう一度あそぶ</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const scoreDisplay = document.getElementById('score-display');
  const resultScreen = document.getElementById('result-screen');

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;

  // 判定カウント用
  let counts = { perfect: 0, great: 0, good: 0, miss: 0 };

  // 判定表示アニメーション
  let judgeText = '';
  let judgeColor = '#2d3436';
  let judgeTimer = 0;

  // ヒットエフェクト
  let hitEffects = [];

  // レーン設定
  const laneCount = 4;
  const laneWidth = canvas.width / laneCount;
  const laneXPositions = [
    laneWidth * 0.5,
    laneWidth * 1.5,
    laneWidth * 2.5,
    laneWidth * 3.5
  ];
  const keyLabels = ['D', 'F', 'J', 'K'];

  // 判定ライン
  const targetY = 500;
  const targetRadius = 28;

  // ホールド状態
  let isLaneHolding = [false, false, false, false];

  // ノーツデータ & 生成制御（100個制限）
  let notes = [];
  let spawnTimer = 0;
  let spawnedCount = 0;
  const totalNotesToSpawn = 100;

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    notes = [];
    spawnTimer = 0;
    spawnedCount = 0;
    scoreDisplay.textContent = 'SCORE: 0';
    resultScreen.style.display = 'none';
  }

  function playSound(freqMult = 1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 * freqMult, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600 * freqMult, audioCtx.currentTime + 0.08);
    
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function createHitEffect(x, y, color) {
    hitEffects.push({ x: x, y: y, radius: 20, maxRadius: 55, alpha: 1.0, color: color });
  }

  function updateCombo(newCombo) {
    combo = newCombo;
    if (combo > maxCombo) maxCombo = combo;
  }

  function applyJudgement(distance, laneIndex) {
    const x = laneXPositions[laneIndex];
    if (distance < 25) {
      judgeText = 'PERFECT!';
      judgeColor = '#fdcb6e';
      score += 100;
      counts.perfect++;
      updateCombo(combo + 1);
      playSound(1.5);
      createHitEffect(x, targetY, '#fdcb6e');
    } else if (distance < 45) {
      judgeText = 'GREAT!';
      judgeColor = '#00b894';
      score += 80;
      counts.great++;
      updateCombo(combo + 1);
      playSound(1.2);
      createHitEffect(x, targetY, '#00b894');
    } else if (distance < 70) {
      judgeText = 'GOOD';
      judgeColor = '#0984e3';
      score += 50;
      counts.good++;
      updateCombo(combo + 1);
      playSound(1.0);
      createHitEffect(x, targetY, '#0984e3');
    }
    judgeTimer = 30;
    scoreDisplay.textContent = `SCORE: ${score}`;
  }

  function triggerMiss() {
    judgeText = 'MISS...';
    judgeColor = '#d63031';
    judgeTimer = 30;
    counts.miss++;
    updateCombo(0);
  }

  function handleTouchStart(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = true;

    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      if (note.lane === laneIndex && !note.holding && note.type !== 'slide') {
        const distance = Math.abs(note.y - targetY);
        if (distance < minDistance) {
          minDistance = distance;
          hitIndex = index;
        }
      }
    });

    if (hitIndex !== -1 && minDistance < 70) {
      const note = notes[hitIndex];
      if (note.type === 'normal') {
        notes.splice(hitIndex, 1);
        applyJudgement(minDistance, laneIndex);
      } else if (note.type === 'hold') {
        note.holding = true;
        applyJudgement(minDistance, laneIndex);
      }
    }
  }

  function handleTouchEnd(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = false;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'hold' && note.holding) {
        const tailY = note.y - note.length;
        const distance = Math.abs(tailY - targetY);
        notes.splice(i, 1);
        applyJudgement(distance, laneIndex);
      }
    }
  }

  function handleSlide(laneIndex) {
    if (!isPlaying) return;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'slide') {
        const distance = Math.abs(note.y - targetY);
        if (distance < 70) {
          notes.splice(i, 1);
          applyJudgement(distance, laneIndex);
        }
      }
    }
  }

  function spawnNotes() {
    if (spawnedCount >= totalNotesToSpawn) return;

    spawnTimer++;
    if (spawnTimer > 45) {
      const lane = Math.floor(Math.random() * laneCount);
      const rand = Math.random();

      if (rand < 0.55) {
        notes.push({ type: 'normal', lane: lane, y: 0, speed: 4 });
      } else if (rand < 0.8) {
        notes.push({ type: 'hold', lane: lane, y: 0, length: 120, speed: 4, holding: false });
      } else {
        // スライドノーツのスピードを他のノーツに合わせて 4 に変更
        notes.push({ type: 'slide', lane: lane, y: 0, speed: 4 });
      }

      spawnTimer = 0;
      spawnedCount++;
    }
  }

  function showResult() {
    isPlaying = false;
    document.getElementById('res-score').textContent = score;
    document.getElementById('res-combo').textContent = maxCombo;
    document.getElementById('res-perfect').textContent = counts.perfect;
    document.getElementById('res-great').textContent = counts.great;
    document.getElementById('res-good').textContent = counts.good;
    document.getElementById('res-miss').textContent = counts.miss;
    
    resultScreen.style.display = 'flex';
  }

  function gameLoop() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // レーン区切り線
    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    for (let i = 1; i < laneCount; i++) {
      ctx.beginPath();
      ctx.moveTo(laneWidth * i, 0);
      ctx.lineTo(laneWidth * i, canvas.height);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // 判定ライン
    for (let i = 0; i < laneCount; i++) {
      const x = laneXPositions[i];
      ctx.save();
      if (isLaneHolding[i]) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#55efc4';
      }
      ctx.beginPath();
      ctx.arc(x, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isLaneHolding[i] ? '#55efc4' : '#fdcb6e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.fillStyle = isLaneHolding[i] ? 'rgba(85, 239, 196, 0.4)' : 'rgba(253, 203, 110, 0.25)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#b2bec3';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(keyLabels[i], x, targetY + 52);
    }

    // ノーツ生成
    spawnNotes();

    // ノーツ移動・描画
    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;
      const x = laneXPositions[note.lane];

      ctx.save();

      if (note.type === 'normal') {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff7675';
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(x, note.y, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 4, note.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'hold') {
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#55efc4';
        ctx.fillStyle = 'rgba(85, 239, 196, 0.7)';
        ctx.fillRect(x - 16, tailY, 32, headY - tailY);

        ctx.fillStyle = '#00b894';
        ctx.beginPath();
        ctx.arc(x, headY, 18, 0, Math.PI * 2);
        ctx.arc(x, tailY, 18, 0, Math.PI * 2);
        ctx.fill();

        if (tailY > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'slide') {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0984e3';
        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.roundRect(x - 22, note.y - 14, 44, 28, 14);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('〰', x, note.y + 7);

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      }

      ctx.restore();
    }

    // ヒットエフェクト描画
    for (let i = hitEffects.length - 1; i >= 0; i--) {
      let effect = hitEffects[i];
      effect.radius += 2.5;
      effect.alpha -= 0.05;

      ctx.save();
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
      ctx.strokeStyle = effect.color;
      ctx.globalAlpha = Math.max(0, effect.alpha);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      if (effect.alpha <= 0) hitEffects.splice(i, 1);
    }

    // 判定文字 & コンボ表示
    if (judgeTimer > 0) {
      ctx.fillStyle = judgeColor;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(judgeText, canvas.width / 2, targetY - 80);
      judgeTimer--;
    }

    if (combo > 1) {
      ctx.fillStyle = '#6c5ce7';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${combo} COMBO!`, canvas.width / 2, targetY - 120);
    }

    // クリア判定
    if (spawnedCount >= totalNotesToSpawn && notes.length === 0) {
      showResult();
      return;
    }

    requestAnimationFrame(gameLoop);
  }

  // イベント登録
  startBtn.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startBtn.style.display = 'none';
    resetGame();
    isPlaying = true;
    gameLoop();
  });

  retryBtn.addEventListener('click', () => {
    resetGame();
    isPlaying = true;
    gameLoop();
  });

  // タッチ操作
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) handleTouchStart(laneIndex);
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) handleSlide(laneIndex);
    }
  });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let lane = 0; lane < laneCount; lane++) {
      let stillTouching = false;
      for (let i = 0; i < e.touches.length; i++) {
        const touchX = e.touches[i].clientX - rect.left;
        const laneIndex = Math.floor(touchX / (rect.width / laneCount));
        if (laneIndex === lane) stillTouching = true;
      }
      if (!stillTouching && isLaneHolding[lane]) handleTouchEnd(lane);
    }
  });

  // マウス＆キーボード操作
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const laneIndex = Math.floor((e.clientX - rect.left) / (rect.width / laneCount));
    if (laneIndex >= 0 && laneIndex < laneCount) handleTouchStart(laneIndex);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons === 1) {
      const rect = canvas.getBoundingClientRect();
      const laneIndex = Math.floor((e.clientX - rect.left) / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) handleSlide(laneIndex);
    }
  });
  canvas.addEventListener('mouseup', (e) => {
    const rect = canvas.getBoundingClientRect();
    const laneIndex = Math.floor((e.clientX - rect.left) / (rect.width / laneCount));
    if (laneIndex >= 0 && laneIndex < laneCount) handleTouchEnd(laneIndex);
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'd' || e.key === 'D') handleTouchStart(0);
    if (e.key === 'f' || e.key === 'F') handleTouchStart(1);
    if (e.key === 'j' || e.key === 'J') handleTouchStart(2);
    if (e.key === 'k' || e.key === 'K') handleTouchStart(3);
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'd' || e.key === 'D') handleTouchEnd(0);
    if (e.key === 'f' || e.key === 'F') handleTouchEnd(1);
    if (e.key === 'j' || e.key === 'J') handleTouchEnd(2);
    if (e.key === 'k' || e.key === 'K') handleTouchEnd(3);
  });
</script>

</body>
</html>
