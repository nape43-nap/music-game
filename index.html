<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 5曲版</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ffeaa7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Kaisei Opti", serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 6px solid #6c5ce7;
      border-radius: 24px;
      background-color: #fcf9f2;
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.03) 15%, transparent 16%),
        radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      background-position: 0 0, 2px 2px;
      box-shadow: 0 12px 24px rgba(108, 92, 231, 0.25);
      overflow: hidden;
      touch-action: none;
      transform: translateY(-19px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
      border: 3px solid #fff;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(214, 48, 49, 0.4);
      font-family: inherit;
    }
    .btn:active {
      transform: translateY(2px);
    }

    #score-display {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #6c5ce7;
      pointer-events: none;
      text-shadow: 1px 1px 0px #fff;
      z-index: 5;
      font-family: inherit;
    }

    #back-to-select-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 14px;
      font-weight: bold;
      color: #6c5ce7;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #6c5ce7;
      border-radius: 16px;
      padding: 5px 12px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      z-index: 10;
      transition: transform 0.1s ease, background 0.1s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #back-to-select-btn:active {
      transform: scale(0.92);
      background: #fff;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(252, 249, 242, 0.96);
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.03) 15%, transparent 16%),
        radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      background-position: 0 0, 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 20;
      padding-top: 20px;
      box-sizing: border-box;
    }

    #select-title {
      font-size: 24px;
      color: #6c5ce7;
      margin-bottom: 10px;
      font-weight: bold;
      animation: floatTitle 2s ease-in-out infinite alternate;
      display: inline-block;
      z-index: 2;
      font-family: inherit;
    }

    @keyframes floatTitle {
      0% { transform: translateY(0) rotate(-1.5deg); }
      100% { transform: translateY(-6px) rotate(1.5deg); }
    }

    #virtual-scroll-viewport {
      width: 320px;
      height: 480px;
      overflow-y: scroll;
      overflow-x: hidden;
      z-index: 2;
      position: relative;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #virtual-scroll-viewport::-webkit-scrollbar {
      display: none;
    }

    #virtual-scroll-spacer {
      position: relative;
      width: 100%;
    }

    .song-card {
      position: absolute;
      left: 10px;
      width: 300px;
      height: 64px;
      padding: 10px 14px;
      background: #fff;
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      border: 3px solid #fdcb6e;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      transition: transform 0.1s ease;
      font-family: inherit;
    }

    .song-card:active {
      transform: scale(0.95) !important;
    }

    .song-info {
      text-align: left;
      flex-grow: 1;
      margin-right: 8px;
      min-width: 0;
    }
    .song-name {
      font-size: 15px;
      font-weight: bold;
      color: #2d3436;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .song-highscore {
      font-size: 14px;
      font-weight: bold;
      color: #6c5ce7;
      text-align: right;
      flex-shrink: 0;
    }

    #particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      pointer-events: none;
      user-select: none;
      animation: floatUp 4s linear forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-630px) rotate(360deg) scale(1.2); opacity: 0; }
    }

    #result-card {
      width: 280px;
      padding: 20px;
      background: #fff;
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.02) 15%, transparent 16%);
      background-size: 4px 4px;
      border: 4px solid #fdcb6e;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      font-family: inherit;
    }
    .result-title {
      font-size: 28px;
      color: #ff7675;
      margin: 0 0 8px 0;
      font-weight: bold;
    }
    .result-score-val {
      font-size: 34px;
      color: #6c5ce7;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .new-record-tag {
      display: inline-block;
      background: #ff7675;
      color: #fff;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .result-details {
      width: 100%;
      margin: 8px 0 16px 0;
      border-top: 2px dashed #dfe6e9;
      padding-top: 8px;
      font-size: 16px;
      color: #2d3436;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>
  
  <button id="back-to-select-btn">◀ 戻る</button>

  <div id="select-screen" class="overlay-screen">
    <div id="particle-container"></div>
    <div id="select-title">★ music select ★</div>
    
    <div id="virtual-scroll-viewport">
      <div id="virtual-scroll-spacer"></div>
    </div>
  </div>

  <div id="result-screen" class="overlay-screen" style="display: none; justify-content: center; padding-top: 0;">
    <div id="result-card">
      <h2 class="result-title">STAGE CLEAR!</h2>
      <div id="new-record" class="new-record-tag" style="display: none;">NEW HIGH SCORE!</div>
      <div id="res-score" class="result-score-val">0</div>
      
      <div class="result-details">
        <div class="result-row"><span>MAX COMBO</span><strong id="res-combo" style="color: #6c5ce7;">0</strong></div>
        <div class="result-row"><span>PERFECT</span><strong id="res-perfect" style="color: #fdcb6e;">0</strong></div>
        <div class="result-row"><span>GREAT</span><strong id="res-great" style="color: #00b894;">0</strong></div>
        <div class="result-row"><span>GOOD</span><strong id="res-good" style="color: #0984e3;">0</strong></div>
        <div class="result-row"><span>MISS</span><strong id="res-miss" style="color: #d63031;">0</strong></div>
      </div>

      <div class="btn-group">
        <button id="select-btn" class="btn" style="background: #b2bec3;">曲選択へ戻る</button>
        <button id="retry-btn" class="btn">もう一度</button>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const songList = [
    { id: 'song_1', name: '1. きらきら星', totalNotes: 25, speed: '4.2', color: '#ff7675' },
    { id: 'song_2', name: '2. チューリップ', totalNotes: 30, speed: '4.5', color: '#00b894' },
    { id: 'song_3', name: '3. どんぐりころころ', totalNotes: 35, speed: '4.8', color: '#6c5ce7' },
    { id: 'song_4', name: '4. ちょうちょう', totalNotes: 40, speed: '5.2', color: '#fdcb6e' },
    { id: 'song_5', name: '5. 大きな栗の木の下で', totalNotes: 45, speed: '5.5', color: '#e84393' }
  ];

  const colors = ['#ff7675', '#00b894', '#6c5ce7', '#fdcb6e', '#e84393'];
  let currentSong = songList[0];

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const selectScreen = document.getElementById('select-screen');
  const resultScreen = document.getElementById('result-screen');
  const viewport = document.getElementById('virtual-scroll-viewport');
  const spacer = document.getElementById('virtual-scroll-spacer');
  const particleContainer = document.getElementById('particle-container');
  const scoreDisplay = document.getElementById('score-display');
  const backToSelectBtn = document.getElementById('back-to-select-btn');
  const retryBtn = document.getElementById('retry-btn');
  const selectBtn = document.getElementById('select-btn');
  const newRecordTag = document.getElementById('new-record');

  const GAME_FONT = '"Kaisei Opti", serif';

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let counts = { perfect: 0, great: 0, good: 0, miss: 0 };

  let judgeText = '';
  let judgeColor = '#2d3436';
  let judgeTimer = 0;
  let hitEffects = [];
  let particleInterval = null;
  let globalAnimTimer = 0;

  const laneCount = 4;
  const laneWidth = canvas.width / laneCount;
  const laneXPositions = [laneWidth * 0.5, laneWidth * 1.5, laneWidth * 2.5, laneWidth * 3.5];
  const keyLabels = ['D', 'F', 'J', 'K'];

  const targetY = 500;
  const targetRadius = 28;
  
  let activeTouches = {};
  let isLaneHolding = [false, false, false, false];

  let notes = [];
  let spawnTimer = 0;
  let spawnedCount = 0;

  /* --- パーティクル --- */
  const symbols = ['♪', '♫', '♬', '✨', '★', '🌸', '🎶'];
  function createParticle() {
    if (selectScreen.style.display === 'none') return;
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.color = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = Math.random() * 320 + 20 + 'px';
    p.style.fontSize = Math.floor(Math.random() * 12 + 16) + 'px';
    const duration = (Math.random() * 2 + 3).toFixed(1);
    p.style.animationDuration = duration + 's';
    particleContainer.appendChild(p);
    setTimeout(() => { p.remove(); }, duration * 1000);
  }

  function startParticles() {
    stopParticles();
    particleInterval = setInterval(createParticle, 400);
  }

  function stopParticles() {
    if (particleInterval) clearInterval(particleInterval);
    particleContainer.innerHTML = '';
  }

  /* --- 仮想スクロール --- */
  const ITEM_HEIGHT = 76;
  const TOTAL_ITEMS = songList.length;
  const SET_HEIGHT = ITEM_HEIGHT * TOTAL_ITEMS;
  
  spacer.style.height = `${SET_HEIGHT * 3}px`;

  function updateVirtualScroll() {
    let scrollTop = viewport.scrollTop;

    if (scrollTop < SET_HEIGHT * 0.5) {
      viewport.scrollTop += SET_HEIGHT;
      scrollTop += SET_HEIGHT;
    } else if (scrollTop > SET_HEIGHT * 2.2) {
      viewport.scrollTop -= SET_HEIGHT;
      scrollTop -= SET_HEIGHT;
    }

    const viewportHeight = viewport.clientHeight;
    const startIndex = Math.floor((scrollTop - ITEM_HEIGHT) / ITEM_HEIGHT);
    const endIndex = Math.ceil((scrollTop + viewportHeight + ITEM_HEIGHT) / ITEM_HEIGHT);

    spacer.innerHTML = '';

    for (let i = startIndex; i <= endIndex; i++) {
      const dataIndex = ((i % TOTAL_ITEMS) + TOTAL_ITEMS) % TOTAL_ITEMS;
      const song = songList[dataIndex];
      const savedScore = localStorage.getItem(`highscore_${song.id}`) || 0;

      const card = document.createElement('div');
      card.className = 'song-card';
      card.style.borderColor = song.color;
      card.style.top = `${i * ITEM_HEIGHT}px`;

      card.innerHTML = `
        <div class="song-info">
          <div class="song-name">${song.name}</div>
        </div>
        <div class="song-highscore">
          <div style="font-size: 10px; color: #b2bec3;">HIGH SCORE</div>
          <div>${Number(savedScore).toLocaleString()}</div>
        </div>
      `;
      
      card.addEventListener('click', () => startSong(song));
      spacer.appendChild(card);
    }
  }

  viewport.addEventListener('scroll', updateVirtualScroll);

  function renderSongSelectUI() {
    isPlaying = false;
    viewport.scrollTop = SET_HEIGHT;
    updateVirtualScroll();
    startParticles();
    selectScreen.style.display = 'flex';
    resultScreen.style.display = 'none';
  }

  /* --- ゲームメイン処理 --- */
  function startSong(song) {
    currentSong = song;
    stopParticles();
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    selectScreen.style.display = 'none';
    resultScreen.style.display = 'none';
    resetGame();
    isPlaying = true;
    gameLoop();
  }

  function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    notes = [];
    spawnTimer = 0;
    spawnedCount = 0;
    activeTouches = {};
    isLaneHolding = [false, false, false, false];
    globalAnimTimer = 0;
    scoreDisplay.textContent = `SCORE: 0`;
  }

  function playSound(freqMult = 1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 * freqMult, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600 * freqMult, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  function createHitEffect(x, y, color) {
    hitEffects.push({ x: x, y: y, radius: 20, maxRadius: 55, alpha: 1.0, color: color });
  }

  function updateCombo(newCombo) {
    combo = newCombo;
    if (combo > maxCombo) maxCombo = combo;
  }

  function applyJudgement(distance, xPos) {
    if (distance < 25) {
      judgeText = 'PERFECT!';
      judgeColor = '#fdcb6e';
      score += 100;
      counts.perfect++;
      updateCombo(combo + 1);
      playSound(1.5);
      createHitEffect(xPos, targetY, '#fdcb6e');
    } else if (distance < 45) {
      judgeText = 'GREAT!';
      judgeColor = '#00b894';
      score += 80;
      counts.great++;
      updateCombo(combo + 1);
      playSound(1.2);
      createHitEffect(xPos, targetY, '#00b894');
    } else if (distance < 70) {
      judgeText = 'GOOD';
      judgeColor = '#0984e3';
      score += 50;
      counts.good++;
      updateCombo(combo + 1);
      playSound(1.0);
      createHitEffect(xPos, targetY, '#0984e3');
    }
    judgeTimer = 30;
    scoreDisplay.textContent = `SCORE: ${score}`;
  }

  function triggerMiss() {
    judgeText = 'MISS...';
    judgeColor = '#d63031';
    judgeTimer = 30;
    counts.miss++;
    updateCombo(0);
  }

  function getHoldXAtY(note, checkY) {
    if (!note.path || note.path.length < 2) return laneXPositions[note.lane];

    for (let i = 0; i < note.path.length - 1; i++) {
      const p1 = { x: laneXPositions[note.path[i].lane], y: note.y - note.path[i].offsetY };
      const p2 = { x: laneXPositions[note.path[i+1].lane], y: note.y - note.path[i+1].offsetY };

      const minY = Math.min(p1.y, p2.y);
      const maxY = Math.max(p1.y, p2.y);

      if (checkY >= minY && checkY <= maxY) {
        if (Math.abs(p2.y - p1.y) < 0.1) return p1.x;
        const t = (checkY - p1.y) / (p2.y - p1.y);
        return p1.x + t * (p2.x - p1.x);
      }
    }
    return laneXPositions[note.path[0].lane];
  }

  // タッチ開始
  function handleTouchDown(touchId, touchX) {
    if (!isPlaying) return;

    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      if (note.holding) return;
      if (note.type === 'slide') return;
      if (note.type === 'hold_slide' && note.holdCompleted) return;

      let expectedX = laneXPositions[note.lane];
      if (note.type === 'curved_hold') {
        expectedX = laneXPositions[note.path[0].lane];
      }

      const distanceY = Math.abs(note.y - targetY);
      const distanceX = Math.abs(touchX - expectedX);

      if (distanceY < 70 && distanceX < laneWidth * 0.8) {
        if (distanceY < minDistance) {
          minDistance = distanceY;
          hitIndex = index;
        }
      }
    });

    if (hitIndex !== -1) {
      const note = notes[hitIndex];
      let noteX = laneXPositions[note.lane];
      if (note.type === 'curved_hold') {
        noteX = laneXPositions[note.path[0].lane];
      }

      if (note.type === 'normal') {
        notes.splice(hitIndex, 1);
        applyJudgement(minDistance, noteX);
      } else {
        note.holding = true;
        note.touchId = touchId;
        activeTouches[touchId] = { x: touchX, activeNote: note };
        applyJudgement(minDistance, noteX);
      }
    } else {
      activeTouches[touchId] = { x: touchX, activeNote: null };
    }
  }

  // タッチ移動
  function handleTouchMove(touchId, touchX) {
    if (!isPlaying) return;
    const touchData = activeTouches[touchId];
    if (!touchData) return;

    touchData.x = touchX;

    notes.forEach((n, index) => {
      if (n.type === 'slide') {
        const distanceY = Math.abs(n.y - targetY);
        const distanceX = Math.abs(touchX - laneXPositions[n.lane]);
        if (distanceY < 70 && distanceX < laneWidth * 0.9) {
          notes.splice(index, 1);
          applyJudgement(distanceY, laneXPositions[n.lane]);
        }
      } else if (n.type === 'hold_slide' && n.holdCompleted) {
        const tailY = n.y - n.length;
        const distanceY = Math.abs(tailY - targetY);
        const distanceX = Math.abs(touchX - laneXPositions[n.lane]);
        if (distanceY < 70 && distanceX < laneWidth * 0.9) {
          notes.splice(index, 1);
          applyJudgement(distanceY, laneXPositions[n.lane]);
        }
      }
    });

    const note = touchData.activeNote;
    if (note && note.holding) {
      if (note.type !== 'hold_slide') {
        let expectedX = laneXPositions[note.lane];
        if (note.type === 'curved_hold') {
          expectedX = getHoldXAtY(note, targetY);
        }
        const distanceX = Math.abs(touchX - expectedX);

        if (distanceX > laneWidth * 0.9) {
          note.holding = false;
          touchData.activeNote = null;
          triggerMiss();
        }
      }
    }
  }

  // タッチ離脱
  function handleTouchUp(touchId) {
    if (!isPlaying) return;
    const touchData = activeTouches[touchId];

    if (touchData && touchData.activeNote) {
      const note = touchData.activeNote;
      if (note.holding) {
        const tailY = note.y - note.length;
        
        if (tailY < targetY - 50) {
          note.holding = false;
          triggerMiss();
        } else {
          if (note.type === 'hold_slide' && !note.holdCompleted) {
            note.holding = false;
            note.holdCompleted = true;
            touchData.activeNote = null;
            setTimeout(() => {
              if (activeTouches[touchId] === touchData) {
                delete activeTouches[touchId];
              }
            }, 600);
          } else {
            const distance = Math.abs(tailY - targetY);
            let expectedX = laneXPositions[note.lane];
            if (note.type === 'curved_hold') {
              expectedX = laneXPositions[note.path[note.path.length - 1].lane];
            }
            const actualTouchX = touchData.x;
            const xDiff = Math.abs(actualTouchX - expectedX);

            const index = notes.indexOf(note);
            if (index !== -1) {
              notes.splice(index, 1);
              if (distance < 70 && xDiff < laneWidth * 0.9) {
                applyJudgement(distance, expectedX);
              } else {
                triggerMiss();
              }
            }
            delete activeTouches[touchId];
          }
        }
      }
    } else {
      delete activeTouches[touchId];
    }
  }

  function spawnNotes() {
    if (spawnedCount >= currentSong.totalNotes) return;

    spawnTimer++;
    if (spawnTimer > 45) {
      const startLane = Math.floor(Math.random() * laneCount);
      const rand = Math.random();
      const spd = Number(currentSong.speed);

      if (rand < 0.25) {
        notes.push({ type: 'normal', lane: startLane, y: 0, speed: spd });
      } else if (rand < 0.50) {
        notes.push({ type: 'hold', lane: startLane, y: 0, length: 140, speed: spd, holding: false });
      } else if (rand < 0.70) {
        const targetLane = (startLane < laneCount - 1) ? startLane + 1 : startLane - 1;
        const length = 180;
        notes.push({
          type: 'curved_hold',
          y: 0,
          length: length,
          speed: spd,
          holding: false,
          path: [
            { lane: startLane, offsetY: 0 },
            { lane: startLane, offsetY: 60 },
            { lane: targetLane, offsetY: 120 },
            { lane: targetLane, offsetY: length }
          ]
        });
      } else if (rand < 0.85) {
        notes.push({ type: 'hold_slide', lane: startLane, y: 0, length: 140, speed: spd, holding: false, holdCompleted: false });
      } else {
        notes.push({ type: 'slide', lane: startLane, y: 0, speed: spd });
      }

      spawnTimer = 0;
      spawnedCount++;
    }
  }

  function showResult() {
    isPlaying = false;

    const prevScore = Number(localStorage.getItem(`highscore_${currentSong.id}`)) || 0;
    if (score > prevScore) {
      localStorage.setItem(`highscore_${currentSong.id}`, score);
      newRecordTag.style.display = 'inline-block';
    } else {
      newRecordTag.style.display = 'none';
    }

    document.getElementById('res-score').textContent = score;
    document.getElementById('res-combo').textContent = maxCombo;
    document.getElementById('res-perfect').textContent = counts.perfect;
    document.getElementById('res-great').textContent = counts.great;
    document.getElementById('res-good').textContent = counts.good;
    document.getElementById('res-miss').textContent = counts.miss;

    resultScreen.style.display = 'flex';
  }

  function gameLoop() {
    if (!isPlaying) return;

    globalAnimTimer += 0.15;
    const pulseScale = 1.0 + Math.sin(globalAnimTimer) * 0.08;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    isLaneHolding = [false, false, false, false];
    Object.values(activeTouches).forEach(touch => {
      const l = Math.min(laneCount - 1, Math.max(0, Math.floor(touch.x / laneWidth)));
      isLaneHolding[l] = true;
    });

    // レーン区切り線
    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    for (let i = 1; i < laneCount; i++) {
      ctx.beginPath();
      ctx.moveTo(laneWidth * i, 0);
      ctx.lineTo(laneWidth * i, canvas.height);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // 判定ライン・ターゲット
    for (let i = 0; i < laneCount; i++) {
      const x = laneXPositions[i];
      ctx.save();
      if (isLaneHolding[i]) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#55efc4';
      }
      ctx.beginPath();
      ctx.arc(x, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isLaneHolding[i] ? '#55efc4' : '#fdcb6e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.fillStyle = isLaneHolding[i] ? 'rgba(85, 239, 196, 0.4)' : 'rgba(253, 203, 110, 0.25)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#b2bec3';
      ctx.font = `bold 18px ${GAME_FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(keyLabels[i], x, targetY + 52);
    }

    spawnNotes();

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;

      if (note.type === 'hold_slide' && !note.holdCompleted) {
        const tailY = note.y - note.length;
        if (tailY > targetY) {
          note.holdCompleted = true;
          note.holding = false;
        }
      }

      let missCheckTailY = note.y;
      if (note.type === 'hold' || note.type === 'curved_hold' || note.type === 'hold_slide') {
        missCheckTailY = note.y - note.length;
      }
      if (missCheckTailY > targetY + 70) {
        notes.splice(i, 1);
        if (note.type === 'hold_slide' && note.holdCompleted) {
          triggerMiss();
        } else if (note.type === 'hold' || note.type === 'curved_hold') {
          if (note.holding) {
            let endX = laneXPositions[note.lane];
            if (note.type === 'curved_hold') endX = laneXPositions[note.path[note.path.length - 1].lane];
            applyJudgement(0, endX);
          } else {
            triggerMiss();
          }
        } else {
          triggerMiss();
        }
        continue;
      }

      ctx.save();

      if (note.type === 'normal') {
        const x = laneXPositions[note.lane];
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff7675';
        ctx.fillStyle = '#ff7675';
        
        ctx.save();
        ctx.translate(x, note.y);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-x, -note.y);

        ctx.beginPath();
        ctx.arc(x, note.y, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 4, note.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (note.type === 'hold') {
        const x = laneXPositions[note.lane];
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        if (headY > tailY) {
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#55efc4';
          ctx.fillStyle = 'rgba(85, 239, 196, 0.7)';
          ctx.fillRect(x - 16, tailY, 32, headY - tailY);
        }

        // 始点
        ctx.save();
        ctx.translate(x, headY);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-x, -headY);
        ctx.fillStyle = '#00b894';
        ctx.beginPath();
        ctx.arc(x, headY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 終点（始点と同じ緑色系に変更）
        ctx.save();
        ctx.translate(x, tailY);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-x, -tailY);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00b894';
        ctx.fillStyle = '#00b894';
        ctx.beginPath();
        ctx.arc(x, tailY, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 4, tailY - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (note.type === 'curved_hold') {
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#a29bfe';
        ctx.strokeStyle = 'rgba(162, 155, 254, 0.8)';
        ctx.lineWidth = 32;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        note.path.forEach((pt, index) => {
          const ptX = laneXPositions[pt.lane];
          let ptY = note.y - pt.offsetY;

          if (note.holding && ptY > targetY) {
            ptY = targetY;
          }

          if (index === 0) ctx.moveTo(ptX, ptY);
          else ctx.lineTo(ptX, ptY);
        });
        ctx.stroke();

        const startX = note.holding ? getHoldXAtY(note, targetY) : laneXPositions[note.path[0].lane];
        const endX = laneXPositions[note.path[note.path.length - 1].lane];

        // 始点
        ctx.save();
        ctx.translate(startX, headY);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-startX, -headY);
        ctx.fillStyle = '#6c5ce7';
        ctx.beginPath();
        ctx.arc(startX, headY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 終点（始点と同じ紫系＋白いハイライトに変更）
        ctx.save();
        ctx.translate(endX, tailY);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-endX, -tailY);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#6c5ce7';
        ctx.fillStyle = '#6c5ce7';
        ctx.beginPath();
        ctx.arc(endX, tailY, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(endX - 4, tailY - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (note.type === 'hold_slide') {
        const x = laneXPositions[note.lane];
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        if (headY > tailY && !note.holdCompleted) {
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#74b9ff';
          ctx.fillStyle = 'rgba(116, 185, 255, 0.6)';
          ctx.fillRect(x - 16, tailY, 32, headY - tailY);
        }

        if (!note.holdCompleted) {
          ctx.save();
          ctx.translate(x, headY);
          ctx.scale(pulseScale, pulseScale);
          ctx.translate(-x, -headY);
          ctx.fillStyle = '#00b894';
          ctx.beginPath();
          ctx.arc(x, headY, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, tailY);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-x, -tailY);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0984e3';
        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.roundRect(x - 22, tailY - 14, 44, 28, 14);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold 20px ${GAME_FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('〰', x, tailY + 7);
        ctx.restore();

      } else if (note.type === 'slide') {
        const x = laneXPositions[note.lane];

        ctx.save();
        ctx.translate(x, note.y);
        ctx.scale(pulseScale, pulseScale);
        ctx.translate(-x, -note.y);

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#0984e3';
        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.roundRect(x - 22, note.y - 14, 44, 28, 14);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold 20px ${GAME_FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('〰', x, note.y + 7);
        ctx.restore();
      }

      ctx.restore();
    }

    for (let i = hitEffects.length - 1; i >= 0; i--) {
      let effect = hitEffects[i];
      effect.radius += 2.5;
      effect.alpha -= 0.05;

      ctx.save();
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
      ctx.strokeStyle = effect.color;
      ctx.globalAlpha = Math.max(0, effect.alpha);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      if (effect.alpha <= 0) hitEffects.splice(i, 1);
    }

    if (judgeTimer > 0) {
      ctx.fillStyle = judgeColor;
      ctx.font = `bold 30px ${GAME_FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(judgeText, canvas.width / 2, targetY - 80);
      judgeTimer--;
    }

    if (combo > 1) {
      ctx.fillStyle = '#6c5ce7';
      ctx.font = `bold 24px ${GAME_FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(`${combo} COMBO!`, canvas.width / 2, targetY - 120);
    }

    if (spawnedCount >= currentSong.totalNotes && notes.length === 0) {
      showResult();
      return;
    }

    requestAnimationFrame(gameLoop);
  }

  backToSelectBtn.addEventListener('click', () => {
    renderSongSelectUI();
  });

  retryBtn.addEventListener('click', () => startSong(currentSong));
  selectBtn.addEventListener('click', () => renderSongSelectUI());

  /* --- PCキーボード操作対応 --- */
  const keyLaneMap = { 'KeyD': 0, 'KeyF': 1, 'KeyJ': 2, 'KeyK': 3 };

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const lane = keyLaneMap[e.code];
    if (lane !== undefined) {
      handleTouchDown(`key_${lane}`, laneXPositions[lane]);
    }
  });

  window.addEventListener('keyup', (e) => {
    const lane = keyLaneMap[e.code];
    if (lane !== undefined) {
      handleTouchUp(`key_${lane}`);
    }
  });

  /* --- タッチ操作対応 --- */
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;

    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const touchX = (touch.clientX - rect.left) * scaleX;
      handleTouchDown(touch.identifier, touchX);
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;

    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      const touchX = (touch.clientX - rect.left) * scaleX;
      handleTouchMove(touch.identifier, touchX);
    }
  });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      handleTouchUp(touch.identifier);
    }
  });

  canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      handleTouchUp(touch.identifier);
    }
  });

  renderSongSelectUI();
</script>

</body>
</html>
