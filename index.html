<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>絵本風音ゲー 光るノーツ版</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f1e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 360px;
      height: 600px;
      border: 4px solid #8e5470;
      border-radius: 16px;
      background-color: #fffdf9;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      touch-action: none;
      transform: translateY(-19px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #ff7675;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      z-index: 10;
    }
    #start-btn:active {
      transform: translate(-50%, -46%);
      box-shadow: none;
    }
    #score-display {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #2d3436;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="score-display">SCORE: 0</div>
  <button id="start-btn">ゲームスタート</button>
  <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const scoreDisplay = document.getElementById('score-display');

  let audioCtx = null;
  let isPlaying = false;
  let score = 0;
  let combo = 0;

  // 判定文字アニメーション
  let judgeText = '';
  let judgeColor = '#2d3436';
  let judgeTimer = 0;

  // タップ時の光のエフェクト（エフェクト粒子の配列）
  let hitEffects = [];

  // レーン設定
  const laneCount = 4;
  const laneWidth = canvas.width / laneCount;
  const laneXPositions = [
    laneWidth * 0.5,
    laneWidth * 1.5,
    laneWidth * 2.5,
    laneWidth * 3.5
  ];
  const keyLabels = ['D', 'F', 'J', 'K'];

  // 判定ライン
  const targetY = 500;
  const targetRadius = 28;

  // ホールド状態
  let isLaneHolding = [false, false, false, false];

  // ノーツデータ
  let notes = [];
  let spawnTimer = 0;

  function playSound(freqMult = 1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 * freqMult, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600 * freqMult, audioCtx.currentTime + 0.08);
    
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  // ヒット時の光の波紋エフェクトを発生させる関数
  function createHitEffect(x, y, color) {
    hitEffects.push({
      x: x,
      y: y,
      radius: 20,
      maxRadius: 55,
      alpha: 1.0,
      color: color
    });
  }

  // 判定適用
  function applyJudgement(distance, laneIndex) {
    const x = laneXPositions[laneIndex];
    
    if (distance < 25) {
      judgeText = 'PERFECT!';
      judgeColor = '#fdcb6e';
      score += 100;
      combo++;
      playSound(1.5);
      createHitEffect(x, targetY, '#fdcb6e');
    } else if (distance < 45) {
      judgeText = 'GREAT!';
      judgeColor = '#00b894';
      score += 80;
      combo++;
      playSound(1.2);
      createHitEffect(x, targetY, '#00b894');
    } else if (distance < 70) {
      judgeText = 'GOOD';
      judgeColor = '#0984e3';
      score += 50;
      combo++;
      playSound(1.0);
      createHitEffect(x, targetY, '#0984e3');
    }
    judgeTimer = 30;
    scoreDisplay.textContent = `SCORE: ${score}`;
  }

  function handleTouchStart(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = true;

    let hitIndex = -1;
    let minDistance = Infinity;

    notes.forEach((note, index) => {
      if (note.lane === laneIndex && !note.holding) {
        const distance = Math.abs(note.y - targetY);
        if (distance < minDistance) {
          minDistance = distance;
          hitIndex = index;
        }
      }
    });

    if (hitIndex !== -1 && minDistance < 70) {
      const note = notes[hitIndex];
      if (note.type === 'normal') {
        notes.splice(hitIndex, 1);
        applyJudgement(minDistance, laneIndex);
      } else if (note.type === 'hold') {
        note.holding = true;
        applyJudgement(minDistance, laneIndex);
      }
    }
  }

  function handleTouchEnd(laneIndex) {
    if (!isPlaying) return;
    isLaneHolding[laneIndex] = false;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'hold' && note.holding) {
        const tailY = note.y - note.length;
        const distance = Math.abs(tailY - targetY);
        notes.splice(i, 1);
        applyJudgement(distance, laneIndex);
      }
    }
  }

  function handleSlide(laneIndex) {
    if (!isPlaying) return;

    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      if (note.lane === laneIndex && note.type === 'slide') {
        const distance = Math.abs(note.y - targetY);
        if (distance < 70) {
          notes.splice(i, 1);
          applyJudgement(distance, laneIndex);
        }
      }
    }
  }

  function spawnNotes() {
    spawnTimer++;
    if (spawnTimer > 45) {
      const lane = Math.floor(Math.random() * laneCount);
      const rand = Math.random();

      if (rand < 0.55) {
        notes.push({ type: 'normal', lane: lane, y: 0, speed: 4 });
      } else if (rand < 0.8) {
        notes.push({ type: 'hold', lane: lane, y: 0, length: 120, speed: 4, holding: false });
      } else {
        notes.push({ type: 'slide', lane: lane, y: 0, speed: 4.5 });
      }

      spawnTimer = 0;
    }
  }

  // メインループ
  function gameLoop() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. レーン区切り線
    ctx.strokeStyle = '#dfe6e9';
    ctx.lineWidth = 2;
    for (let i = 1; i < laneCount; i++) {
      ctx.beginPath();
      ctx.moveTo(laneWidth * i, 0);
      ctx.lineTo(laneWidth * i, canvas.height);
      ctx.stroke();
    }

    // 2. 判定ライン描画
    for (let i = 0; i < laneCount; i++) {
      const x = laneXPositions[i];
      
      ctx.save();
      if (isLaneHolding[i]) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#55efc4';
      }
      ctx.beginPath();
      ctx.arc(x, targetY, targetRadius, 0, Math.PI * 2);
      ctx.strokeStyle = isLaneHolding[i] ? '#55efc4' : '#fdcb6e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.fillStyle = isLaneHolding[i] ? 'rgba(85, 239, 196, 0.4)' : 'rgba(253, 203, 110, 0.2)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#b2bec3';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(keyLabels[i], x, targetY + 55);
    }

    // 3. ノーツ生成
    spawnNotes();

    // 4. ノーツの移動・光る描写
    for (let i = notes.length - 1; i >= 0; i--) {
      let note = notes[i];
      note.y += note.speed;
      const x = laneXPositions[note.lane];

      ctx.save(); // 発光処理用に描画状態を保存

      if (note.type === 'normal') {
        // 赤ノーツ（発光エフェクト）
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff7675';
        ctx.fillStyle = '#ff7675';
        
        ctx.beginPath();
        ctx.arc(x, note.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // 中心の白いくっきりしたハイライト
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x - 4, note.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'hold') {
        // ロングノーツ（緑発光）
        const headY = note.holding ? targetY : note.y;
        const tailY = note.y - note.length;

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#55efc4';

        ctx.fillStyle = 'rgba(85, 239, 196, 0.7)';
        ctx.fillRect(x - 16, tailY, 32, headY - tailY);

        ctx.fillStyle = '#00b894';
        ctx.beginPath();
        ctx.arc(x, headY, 18, 0, Math.PI * 2);
        ctx.arc(x, tailY, 18, 0, Math.PI * 2);
        ctx.fill();

        if (tailY > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      } else if (note.type === 'slide') {
        // スライドノーツ（青発光）
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#74b9ff';

        ctx.fillStyle = '#74b9ff';
        ctx.beginPath();
        ctx.arc(x, note.y, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('＞', x, note.y + 6);

        if (note.y > targetY + 70) {
          notes.splice(i, 1);
          triggerMiss();
        }
      }

      ctx.restore(); // 発光処理をリセット
    }

    // 5. ヒット時の光の波紋エフェクト描画
    for (let i = hitEffects.length - 1; i >= 0; i--) {
      let effect = hitEffects[i];
      effect.radius += 2.5;
      effect.alpha -= 0.05;

      ctx.save();
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
      ctx.strokeStyle = effect.color;
      ctx.globalAlpha = Math.max(0, effect.alpha);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      if (effect.alpha <= 0) {
        hitEffects.splice(i, 1);
      }
    }

    // 6. 判定文字 & コンボ表示
    if (judgeTimer > 0) {
      ctx.fillStyle = judgeColor;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(judgeText, canvas.width / 2, targetY - 80);
      judgeTimer--;
    }

    if (combo > 1) {
      ctx.fillStyle = '#6c5ce7';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${combo} COMBO!`, canvas.width / 2, targetY - 120);
    }

    requestAnimationFrame(gameLoop);
  }

  function triggerMiss() {
    judgeText = 'MISS...';
    judgeColor = '#d63031';
    judgeTimer = 30;
    combo = 0;
  }

  startBtn.addEventListener('click', () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startBtn.style.display = 'none';
    isPlaying = true;
    gameLoop();
  });

  // タッチ・マウス・キーボード操作
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) {
        handleTouchStart(laneIndex);
        handleSlide(laneIndex);
      }
    }
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      const touchX = e.touches[i].clientX - rect.left;
      const laneIndex = Math.floor(touchX / (rect.width / laneCount));
      if (laneIndex >= 0 && laneIndex < laneCount) {
        handleSlide(laneIndex);
      }
    }
  });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let lane = 0; lane < laneCount; lane++) {
      let stillTouching = false;
      for (let i = 0; i < e.touches.length; i++) {
        const touchX = e.touches[i].clientX - rect.left;
        const laneIndex = Math.floor(touchX / (rect.width / laneCount));
        if (laneIndex === lane) stillTouching = true;
      }
      if (!stillTouching && isLaneHolding[lane]) {
        handleTouchEnd(lane);
      }
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const laneIndex = Math.floor((e.clientX - rect.left) / (rect.width / laneCount));
    if (laneIndex >= 0 && laneIndex < laneCount) handleTouchStart(laneIndex);
  });
  canvas.addEventListener('mouseup', (e) => {
    const rect = canvas.getBoundingClientRect();
    const laneIndex = Math.floor((e.clientX - rect.left) / (rect.width / laneCount));
    if (laneIndex >= 0 && laneIndex < laneCount) handleTouchEnd(laneIndex);
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'd' || e.key === 'D') handleTouchStart(0);
    if (e.key === 'f' || e.key === 'F') handleTouchStart(1);
    if (e.key === 'j' || e.key === 'J') handleTouchStart(2);
    if (e.key === 'k' || e.key === 'K') handleTouchStart(3);
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'd' || e.key === 'D') handleTouchEnd(0);
    if (e.key === 'f' || e.key === 'F') handleTouchEnd(1);
    if (e.key === 'j' || e.key === 'J') handleTouchEnd(2);
    if (e.key === 'k' || e.key === 'K') handleTouchEnd(3);
  });
</script>

</body>
</html>
